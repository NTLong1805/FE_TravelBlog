<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Blogs - Contact</title>
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="../favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
  <link rel="shortcut icon" href="../favicon/favicon.ico" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Main CSS -->
  <link rel="stylesheet" href="../assets/css/main.css">
  

<body>

  <!-- Header -->
  <header class="header">
    <div class="container"></div>
  </header>

  <!-- Contact Hero Section -->
  <section class="contact-hero">
    <div class="container">
      <h1 class="contact-title">Hi, 👋 how can we help you?</h1>
      <p class="contact-subtitle">Let's talk with us for various kind of topics and more about travel</p>
    </div>
  </section>

  <!-- Contact Info Section -->
  <section class="contact-info-section">
    <div class="container">
      <div class="contact-info">
        <div class="contact-item">
          <div class="contact-icon phone">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" fill="white"/>
            </svg>
          </div>
          <div class="contact-details">
            <span class="contact-label">Phone</span>
            <span class="contact-value">(000) 123 456 789</span>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-icon email">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2.5 6.5L10 11L17.5 6.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2.5 6.5H17.5V15C17.5 15.2761 17.2761 15.5 17 15.5H3C2.72386 15.5 2.5 15.2761 2.5 15V6.5Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="contact-details">
            <span class="contact-label">Email</span>
            <span class="contact-value">Contact@email.com</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-form-section">
    <div class="container">
      <form class="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Your name</label>
            <input type="text" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Your email address</label>
            <input type="email" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Your phone number</label>
            <input type="tel" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Subject</label>
            <select class="form-input form-select">
              <option value="">Select a subject</option>
              <option value="general">General Inquiry</option>
              <option value="booking">Booking</option>
              <option value="support">Support</option>
              <option value="collaborate">I want to collaborate</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea class="form-input form-textarea" rows="8"></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container"></div>
  </footer>

  <!-- Back to Top Button -->
  <a href="#" class="back-to-top"><i class="fas fa-arrow-up"></i></a>

  <!-- Scripts -->
  <script>
    // Function to load external HTML
    function loadHTML(url, element) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              element.innerHTML = xhr.responseText;
              resolve();
            } else {
              console.error('Error loading ' + url + ': ' + xhr.status);
              reject();
            }
          }
        };
        xhr.send();
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Load header
      const header = document.querySelector('.header .container');
      if (header) {
        loadHTML('../template/header.html', header)
          .then(() => console.log('Header loaded'))
          .catch(() => console.error('Failed to load header'));
      }

      // Load footer
      const footer = document.querySelector('.footer .container');
      if (footer) {
        loadHTML('../template/footer.html', footer)
          .then(() => console.log('Footer loaded'))
          .catch(() => console.error('Failed to load footer'));
      }

      // Back to top button
      const backToTop = document.querySelector('.back-to-top');
      if (backToTop) {
        window.addEventListener('scroll', function () {
          backToTop.classList.toggle('show', window.pageYOffset > 300);
        });

        backToTop.addEventListener('click', function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    });
  </script>

</body>
