<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Blogs - My Posts</title>
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="../favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="../favicon/favicon.svg" />
    <link rel="shortcut icon" href="../favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="../favicon/site.webmanifest" />
    <!-- Font Manrope -->
    <link rel="stylesheet" href="../assets/font/Manrope/stylesheet.css" />

    <style>
      #editorjs {
        min-height: fit-content !important;
      }

      .container-card {
        margin: 0 auto;
        padding: 100px 20px 0px 20px;
      }

      .codex-editor .codex-editor__redactor {
        padding-bottom: 0px !important;
        min-height: 250px !important;
      }

      .ce-block__content {
        max-width: 100% !important;
        margin: 10px 65px 10px 20px;
      }

      .ce-toolbar {
        left: auto !important;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <header id="header" class="header"></header>

    <main class="my-posts container">
      <div class="my-posts__header">
        <nav class="my-posts__nav">
          <ul class="my-posts__tabs">
            <li class="my-posts__tab my-posts__tab--active" data-status="0">
              All
            </li>
            <li class="my-posts__tab" data-status="1">In Review</li>
            <li class="my-posts__tab" data-status="2">Publish</li>
            <li class="my-posts__tab" data-status="3">Cancelled/Rejected</li>
          </ul>
        </nav>

        <button class="my-posts__btn-create" id="btn-create-post">
          <i class="fas fa-plus"></i> Create Request Post
        </button>
      </div>

      <section class="my-posts__list" id="posts-list"></section>

      <nav class="my-posts__pagination" id="pagination"></nav>
    </main>

    <footer id="footer" class="footer"></footer>

    <!-- Modal Overlay -->
    <div
      class="modal"
      id="create-post-modal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal__overlay"></div>
      <div
        class="modal__content"
        role="document"
        tabindex="0"
        aria-labelledby="modal-title"
      >
        <button
          class="modal__close-btn"
          id="close-modal"
          aria-label="Close Modal"
        >
          &times;
        </button>
        <h2 id="modal-title">Create Request Post</h2>
        <form
          id="create-post-form"
          class="create-post-form"
          enctype="multipart/form-data"
        >
          <label for="post-title">Title</label>
          <input type="text" id="post-title" name="title" required />

          <label for="post-country">Country</label>
          <select id="post-country" name="country" required>
            <option value=""  selected>Select country</option>
          </select>

          <label for="post-destination">Destination</label>
          <select id="post-destination" name="destination" required >
            <option value=""  selected>Select destination</option>
          </select>

          <label for="post-category">Category</label>
          <select id="post-category" name="category" required>
            <option value="" selected>Select category</option>
          </select>

          <label for="post-thumbnail">Thumbnail</label>
          <input
            type="file"
            id="post-thumbnail"
            name="thumbnail"
            accept="image/*"
            required
          />
          <img
            id="thumbnail-preview"
            alt="Thumbnail Preview"
            style="max-width: 100%; margin-top: 0.5rem; display: none"
          />

          <label>Content</label>
          <div id="editorjs"></div>

          <button type="submit" class="btn-submit">Submit Post</button>
        </form>
      </div>
    </div>

    <script src="../assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="../assets/js/scripts.js"></script>
    <script>
      load("#header", "../template/header.html");
      load("#footer", "../template/footer.html");
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/raw@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/image@latest"></script>
    <script type="module" src="../assets/js/my-posts.js"></script>
  </body>
</html>
